<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share-X-Pr0 - Page Not Found</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-app);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .error-container {
            text-align: center;
            max-width: 480px;
            width: 100%;
            padding: 2rem;
            animation: fadeInUp 0.6s ease-out both;
        }

        .error-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            25% {
                transform: translateY(-12px) rotate(-3deg);
            }

            75% {
                transform: translateY(-6px) rotate(3deg);
            }
        }

        .error-code {
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #818cf8, #a78bfa, #c084fc);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            animation: glitch 3s ease-in-out infinite;
        }

        @keyframes glitch {

            0%,
            90%,
            100% {
                text-shadow: none;
                filter: none;
            }

            92% {
                filter: blur(1px);
                transform: translateX(-2px);
            }

            94% {
                filter: none;
                transform: translateX(2px);
            }

            96% {
                filter: blur(0.5px);
                transform: translateX(-1px);
            }

            98% {
                filter: none;
                transform: translateX(0);
            }
        }

        .error-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.75rem;
        }

        .error-desc {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.85rem 2rem;
            border-radius: 50px;
            background: var(--brand-primary);
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-home:hover {
            background: var(--brand-primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        @media (max-width: 480px) {
            .error-code {
                font-size: 5rem;
            }

            .error-title {
                font-size: 1.25rem;
            }

            .error-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <button id="themeToggle" class="floating-theme-toggle" aria-label="Toggle Theme">
        <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
    </button>

    <div class="error-container">
        <div class="error-icon">🧑‍🚀</div>
        <div class="error-code">404</div>
        <h1 class="error-title">Lost in Space</h1>
        <p class="error-desc">The page you're looking for doesn't exist or has been moved to another galaxy.</p>
        <a href="/" class="btn-home">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
            </svg>
            Back to Home
        </a>
    </div>

    <!-- Developer Credit -->
    <footer class="dev-credit-footer" id="devCredit">
        <div class="dev-credit-inner">
            <span class="dev-sparkle">✨</span>
            <span>Developed with</span>
            <span class="dev-heart">❤️</span>
            <span>by</span>
            <a href="https://abdulrahmanp0rtfolio.pythonanywhere.com" target="_blank" rel="noopener noreferrer"
                class="dev-credit-link">Abdulrahman AH</a>
            <span class="dev-sparkle">✨</span>
        </div>
    </footer>
</body>

</html>
