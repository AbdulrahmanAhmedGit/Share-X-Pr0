<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share-X-Pr0 - Room Created</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: var(--bg-app);
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
            z-index: 1;
        }

        .container {
            background: var(--bg-surface);
            padding: 3.5rem;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            text-align: center;
            max-width: 450px;
            width: 100%;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: var(--brand-primary);
            margin-bottom: 2.5rem;
            font-size: 2.2rem;
            font-weight: 700;
        }

        .qr-container {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .qr-container img {
            border-radius: 16px;
            box-shadow: var(--shadow-md);
            border: 4px solid var(--bg-surface-hover);
            padding: 8px;
            background: white;
            max-width: 100%;
        }

        .code-display {
            background: rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            margin-bottom: 2rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .code-display:hover {
            border-color: var(--brand-primary);
            background: var(--bg-surface-hover);
            transform: translateY(-2px);
        }

        .code {
            font-size: 1.5rem;
            font-family: monospace;
            letter-spacing: 2px;
            color: var(--brand-primary);
            word-break: break-all;
            margin: 0;
        }

        .sub-text {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.1rem;
            text-align: center;
            transition: all 0.3s ease;
            box-sizing: border-box;
            cursor: pointer;
        }

        .btn-primary {
            background-color: var(--brand-primary);
            color: #fff;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--brand-primary-hover);
            transform: translateY(-2px);
        }

        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: block;
        }

        .btn-ghost:hover {
            color: var(--text-primary);
        }
    </style>
</head>

<body>
    <button id="themeToggle" class="floating-theme-toggle" aria-label="Toggle Theme">
        <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
    </button>
    <div class="container">
        <h1>Room Created</h1>

        <div class="qr-container">
            <!-- QR Code auto-generated via qrserver API -->
            <img id="qrCodeImg"
                src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data={{ code }}&bgcolor=ffffff&color=4f46e5"
                alt="QR Code">
        </div>

        <div class="code-display" id="copyBtn" title="Click to copy">
            <p class="code" id="roomCode">{{ code }}</p>
            <span class="sub-text">Click to copy code before entering!</span>
        </div>

        <a href="/main/{{ code }}" class="btn btn-primary">Enter Room</a>
        <a href="/" class="btn btn-ghost">Back to Home</a>
    </div>

    <script>
        document.getElementById('copyBtn').addEventListener('click', () => {
            const codeText = document.getElementById('roomCode').innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                const subText = document.querySelector('.sub-text');
                const originalText = subText.innerText;
                subText.innerText = "Copied to clipboard!";
                subText.style.color = "var(--status-success, #10b981)";

                setTimeout(() => {
                    subText.innerText = originalText;
                    subText.style.color = "var(--text-secondary)";
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        });
    </script>
</body>

</html>
